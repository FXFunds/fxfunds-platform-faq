[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fxfunds-platform-faq"
version = "2.0.0"
description = "FXFunds Platform FAQ — searchable database of questions people ask about FXFunds: legitimacy, regulation, security, trading, deposits, withdrawals and more."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "FXFunds" }]
requires-python = ">=3.9"
keywords = ["fxfunds", "faq", "fxfunds review", "regulation", "forex", "cryptocurrency", "stablecoin", "usdt"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://fxfunds.com/"
Repository = "https://github.com/FXFunds/fxfunds-platform-faq"
Documentation = "https://fxfunds-platform-faq.readthedocs.io"
DOI = "https://doi.org/10.5281/zenodo.23467989"

[project.scripts]
fxfunds-faq = "fxfunds_platform_faq.__main__:main"

[tool.setuptools]
packages = ["fxfunds_platform_faq"]

[tool.setuptools.package-data]
fxfunds_platform_faq = ["*.json"]
